<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🕌 Support Masjid Construction & Islamic Education 📖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #f9fafb; color: #111; min-height: 100vh; display: flex; 
            align-items: center; justify-content: center; padding: 20px 16px; 
        }
        .card { 
            width: 100%; max-width: 400px; background: #fff; border-radius: 20px; 
            padding: 30px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            border: 1px solid #f0f0f0; 
        }
        h1 { font-size: 18px; line-height: 1.4; font-weight: 700; margin-bottom: 24px; color: #111; }
        
        /* QR Code Section */
        .qr-wrap { display: inline-flex; padding: 14px; border-radius: 16px; border: 1px solid #eee; background: #fff; margin-bottom: 10px; }
        .qr-wrap img { width: 200px; height: 200px; display: block; object-fit: contain; }
        
        .download-btn { 
            display: inline-flex; align-items: center; gap: 5px; margin-bottom: 24px; 
            font-size: 12px; font-weight: 600; color: #555; text-decoration: none; 
            border: 1px solid #e5e5e5; padding: 6px 14px; border-radius: 8px; background: #fff; 
        }

        /* Owner Info */
        .owner { margin-bottom: 20px; }
        .owner .name { font-size: 16px; font-weight: 700; }
        .owner .sub { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; margin-top: 2px; }
        
        /* Big Copy UPI Section */
        .copy-box {
            background: #f0fdf4; border: 1.5px dashed #22c55e; padding: 20px 16px;
            border-radius: 16px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .copy-box:active { background: #dcfce7; }
        .copy-box .label { font-size: 12px; color: #166534; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .copy-box .id { font-size: 22px; font-weight: 800; color: #166534; margin-bottom: 12px; letter-spacing: 0.5px; }
        .copy-box .btn { 
            background: #22c55e; color: #fff; border: none; padding: 12px 24px; 
            border-radius: 10px; font-size: 15px; font-weight: 700; width: 100%; 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
        }
        
        .note { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>
    <main class="card">
        <h1>🕌 Support Masjid Construction & Islamic Education 📖🤲</h1>
        
        <!-- QR Code -->
        <div class="qr-wrap">
            <img id="qrImage" src="images/mdqr.jpeg" alt="Scan to donate" />
        </div>
        <br>
        <a href="images/mdqr.jpeg" download="Masjid_Donation_QR.jpeg" class="download-btn"> Download QR </a>
        
        <!-- Name -->
        <div class="owner">
            <div class="name">Mohammed Imran Saeed</div>
            <div class="sub">Account Holder</div>
        </div>
        
        <!-- UPI Copy Button (The main working feature) -->
        <div class="copy-box" onclick="copyUPI()">
            <div class="label">Tap to Copy UPI ID</div>
            <div class="id">7485019664@mbk</div>
            <button class="btn" id="copyBtnText">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy UPI ID
            </button>
        </div>

        <div class="note">
            Aap QR Code scan karke ya UPI ID copy karke apni kisi bhi payment app (Paytm, PhonePe, GPay) se donate kar sakte hain.
        </div>
    </main>

    <script>
        const upiId = "7485019664@mbk";

        function copyUPI() {
            // Modern Copy method
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(upiId).then(() => {
                    showSuccess();
                });
            } else {
                // Fallback for older browsers
                const textArea = document.createElement("textarea");
                textArea.value = upiId;
                textArea.style.position = "absolute";
                textArea.style.left = "-999999px";
                document.body.prepend(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showSuccess();
                } catch (error) {
                    console.error(error);
                } finally {
                    textArea.remove();
                }
            }
        }

        function showSuccess() {
            const btn = document.getElementById('copyBtnText');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ UPI ID Copied!";
            btn.style.background = "#16a34a"; // Darker green
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "#22c55e";
            }, 2500);
        }
    </script>
</body>
</html>
