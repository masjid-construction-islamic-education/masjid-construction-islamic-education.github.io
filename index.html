<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>🕌 Support Masjid Construction & Islamic Education 📖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 28px 22px 26px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0f0f0;
        }

        h1 {
            font-size: 19px;
            line-height: 1.4;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .qr-wrap {
            display: inline-flex;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #eee;
            background: #fff;
        }

        .qr-wrap img {
            width: 196px;
            height: 196px;
            display: block;
            object-fit: contain;
        }

        /* Download Button Style */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-decoration: none;
            border: 1px solid #e5e5e5;
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .download-btn:active {
            background: #f5f5f5;
        }

        .download-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .owner {
            margin-top: 16px;
        }

        .owner .name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .owner .sub {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9a9a9a;
        }

        .upi-row {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f2f2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .upi-row .label {
            width: 100%;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9a9a9a;
            margin-bottom: 2px;
        }

        .upi-id {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .copy-btn {
            border: 1px solid #e5e5e5;
            background: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #111;
            cursor: pointer;
        }

        .copy-btn.copied {
            color: #0a8f3c;
            border-color: #b8e6c9;
        }

        .apps {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid #ececec;
            background: #fff;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: transform .08s ease, background .15s ease;
        }

        .app-btn:active {
            transform: scale(0.985);
            background: #fafafa;
        }

        .brand {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: block;
        }
    </style>
</head>

<body>

    <main class="card">
        <h1>🕌 Support Masjid Construction &amp; Islamic Education 📖🤲</h1>

        <div class="qr-wrap">
            <img id="qrImage" src="images/mdqr.jpeg" alt="Scan to donate via UPI" />
        </div>

        <!-- Download QR Button -->
        <br>
        <a href="images/mdqr.jpeg" download="Masjid_Donation_QR.jpeg" class="download-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
            </svg>
            Download QR
        </a>

        <div class="owner">
            <div class="name">Mohammed Imran Saeed</div>
            <div class="sub">Account Holder</div>
        </div>

        <div class="upi-row">
            <span class="label">UPI ID</span>
            <span class="upi-id" id="upiId">7485019664@mbk</span>
            <button class="copy-btn" id="copyBtn" type="button">Copy</button>
        </div>

        <div class="apps">
            <!-- Direct App Links (Mobile par direct khulega) -->

            <!-- Paytm -->
            <a class="app-btn" href="paytmmp://pay?pa=7485019664@mbk&pn=Mohammed%20Imran%20Saeed&cu=INR">
                <svg class="brand" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#00BAF2" />
                    <text x="16" y="22.5" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#fff"
                        text-anchor="middle">P</text>
                </svg>
                Pay with Paytm
            </a>

            <!-- PhonePe -->
            <a class="app-btn" href="phonepe://pay?pa=7485019664@mbk&pn=Mohammed%20Imran%20Saeed&cu=INR">
                <svg class="brand" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#5F259F" />
                    <text x="16" y="21.5" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#fff"
                        text-anchor="middle">पे</text>
                </svg>
                Pay with PhonePe
            </a>

            <!-- Google Pay -->
            <a class="app-btn" href="tez://upi/pay?pa=7485019664@mbk&pn=Mohammed%20Imran%20Saeed&cu=INR">
                <svg class="brand" viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#fff" stroke="#e8e8e8" />
                    <g transform="translate(4 4) scale(0.5)">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </g>
                </svg>
                Pay with Google Pay
            </a>

            <!-- Other UPI Apps -->
            <a class="app-btn" href="upi://pay?pa=7485019664@mbk&pn=Mohammed%20Imran%20Saeed&cu=INR"
                style="background: #f8f9fa; border-color: #d1d5db; margin-top: 5px;">
                <svg class="brand" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#4B5563" />
                    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#fff"
                        text-anchor="middle">₹</text>
                </svg>
                Pay with Other UPI App
            </a>
        </div>
    </main>

    <script>
        // Copy UPI ID Function
        const upiId = "7485019664@mbk";
        const copyBtn = document.getElementById("copyBtn");

        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(upiId);
            } catch {
                const t = document.createElement("textarea");
                t.value = upiId;
                document.body.appendChild(t);
                t.select();
                document.execCommand("copy");
                document.body.removeChild(t);
            }
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
                copyBtn.textContent = "Copy";
                copyBtn.classList.remove("copied");
            }, 1500);
        });
    </script>
</body>

</html>
